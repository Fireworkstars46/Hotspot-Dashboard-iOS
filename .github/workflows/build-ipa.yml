name: Build Hotspot Dashboard IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iPhone app
        run: |
          set -euxo pipefail
          xcodebuild \
            -project HotspotDashboard.xcodeproj \
            -target HotspotDashboard \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP_PATH="$PWD/build/Release-iphoneos/HotspotDashboard.app"
          test -d "$APP_PATH"
          rm -rf Payload HotspotDashboard.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry HotspotDashboard.ipa Payload
          ls -lh HotspotDashboard.ipa

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotspotDashboard-unsigned-IPA
          path: HotspotDashboard.ipa
          if-no-files-found: error

      - name: Publish Sideloadly IPA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if gh release view sideloadly >/dev/null 2>&1; then
            gh release upload sideloadly HotspotDashboard.ipa --clobber
          else
            gh release create sideloadly HotspotDashboard.ipa \
              --title "Hotspot Dashboard - Sideloadly IPA" \
              --notes "Unsigned IPA built by GitHub Actions. Use Sideloadly to sign and install it."
          fi
